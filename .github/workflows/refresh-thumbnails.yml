name: Refresh backup screenshots

# Manual only. eweb247.com's CloudFront blocks GitHub's servers ("403 ERROR / Request blocked"),
# so a scheduled run here can't reach the sites. Run `python capture.py` on a normal computer
# instead; capture.py now refuses to save error pages either way.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Capture thumbnails
        run: python capture.py

      - name: Commit updated thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbnails
          git diff --staged --quiet || git commit -m "Refresh backup screenshots"
          git push
