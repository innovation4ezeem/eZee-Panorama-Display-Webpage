<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Opening site</title>
<!--
  One link per property that picks the live site when it's up and the backup when it isn't.
    go.html?hotelzara            live if it answers within 5 s, otherwise the saved copy
    go.html?hotelzara&backup     always the saved copy
  Slugs are the "slug" values in sites.js.
-->
<style>
:root{--lobby:#123B34;--linen:#F2F4F1;--ink:#17211E;--mute:#5E6A65;--brass:#B98A3E;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--linen:#101614;--ink:#E7ECE9;--mute:#9AA7A1}}
:root[data-theme="dark"]{--linen:#101614;--ink:#E7ECE9;--mute:#9AA7A1}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box;background:var(--linen);color:var(--ink);font:16px/1.55 var(--sans);text-align:center}
p{margin:0 0 8px}small{color:var(--mute)}a{color:inherit}
</style>
</head>
<body>
<div><p id="msg">Opening…</p><small id="sub"></small></div>
<script src="sites.js"></script>
<script>
(function(){
  var q = location.search.slice(1).split('&'), slug = decodeURIComponent(q[0] || '').toLowerCase();
  var forceBackup = q.indexOf('backup') > -1;
  var s = (window.SITES || []).filter(function(x){ return x.slug === slug })[0];
  var msg = document.getElementById('msg'), sub = document.getElementById('sub');
  if (!s) { msg.innerHTML = 'Unknown property “'+slug.replace(/[<>&"]/g,'')+'”. <a href="index.html">See all properties</a>'; return }
  msg.textContent = 'Opening ' + s.name + '…';
  var done = false;
  function go(url, why){ if (done) return; done = true; sub.textContent = why; location.replace(url) }
  function backup(){ s.offline ? go(encodeURI(s.offline), 'Main site not responding, showing the backup')
                               : go(s.url, 'No backup saved for this property') }
  if (forceBackup) return backup();
  var ctrl = window.AbortController ? new AbortController() : null;
  setTimeout(function(){ ctrl && ctrl.abort(); backup() }, 5000);
  fetch(s.url, {mode:'no-cors', cache:'no-store', signal: ctrl && ctrl.signal})
    .then(function(){ go(s.url, '') }, backup);
})();
</script>
</body>
</html>
